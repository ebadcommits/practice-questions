<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.content {
    display: none;
}

.content.active {
    display: block;
}

.tab.active {
    background: black;
    color: white;
}
    </style>
</head>
<body>
    <div class="tabs">
    <button class="tab active" data-tab="1">Tab 1</button>
    <button class="tab" data-tab="2">Tab 2</button>
    <button class="tab" data-tab="3">Tab 3</button>
</div>

<div class="contents">
    <div class="content active" data-content="1">This is content 1</div>
    <div class="content" data-content="2">This is content 2</div>
    <div class="content" data-content="3">This is content 3</div>
</div>
    <script src="tabs.js"></script>
</body>
</html>
